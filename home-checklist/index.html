<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const seed = JSON.parse($('checklist-data').textContent);
  const key = 'new-home-checklist:' + seed.documentId;
  const clone = value => JSON.parse(JSON.stringify(value));
  const uid = () => 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,9);
  const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const icons = {
    trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>',
    star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
  };
  const icon = name => '<svg viewBox="0 0 24 24" aria-hidden="true">' + icons[name] + '</svg>';
  function valid(value) {
    const ids = new Set();
    const claim = id => typeof id === 'string' && id.length < 160 && !ids.has(id) && !!ids.add(id);
    return !!value && value.version === 1 && value.documentId === seed.documentId && Array.isArray(value.categories) && value.categories.length < 500 && value.categories.every(c => c && claim(c.id) && typeof c.name === 'string' && c.name.length <= 120 && Array.isArray(c.items) && c.items.length < 10000 && c.items.every(i => i && claim(i.id) && typeof i.name === 'string' && i.name.length <= 500 && typeof i.done === 'boolean' && typeof i.priority === 'boolean'));
  }
  let state = clone(seed), storageOK = true;
  try { const saved = localStorage.getItem(key); if(saved) {const parsed = JSON.parse(saved); if(valid(parsed)) state = parsed;} } catch (_) {storageOK = false;}
  let currentCategory = '', query = '', filter = 'all', bulk = false;
  let selected = new Set(), history = [], editStart = null, saveTimer, toastTimer;
  const findCategory = id => state.categories.find(c => c.id === id);
  const findItem = id => {for(const c of state.categories) {const item=c.items.find(i=>i.id===id);if(item)return {category:c,item};}return null;};
  const getCounts = () => state.categories.reduce((s,c) => {s.total+=c.items.length;s.priority+=c.items.filter(i=>i.priority).length;s.done+=c.items.filter(i=>i.done).length;return s;},{total:0,priority:0,done:0});
  function save() {
    clearTimeout(saveTimer);
    try {localStorage.setItem(key, JSON.stringify(state));storageOK=true;} catch (_) {storageOK=false;}
    $('save-state').textContent = storageOK ? '修改已保存在此浏览器' : '请用「保存 HTML」保留修改';
    $('save-state').classList.toggle('failed',!storageOK);
  }
  function saveSoon() {clearTimeout(saveTimer);$('save-state').textContent='正在保存…';saveTimer=setTimeout(save,180);}
  function remember(snapshot=state) {history.push(clone(snapshot));if(history.length>50)history.shift();$('undo').disabled=false;}
  function finishEdit() {if(editStart) {if(JSON.stringify(editStart)!==JSON.stringify(state))remember(editStart);editStart=null;}}
  function transact(change,message) {finishEdit();remember();change();save();render();if(message)notify(message,true);}
  function notify(message,canUndo=false) {clearTimeout(toastTimer);$('toast-message').textContent=message;$('toast-undo').hidden=!canUndo;$('toast').hidden=false;toastTimer=setTimeout(()=>{$('toast').hidden=true;},5000);}
  function visibleGroups() {
    const q=query.trim().toLocaleLowerCase();
    return state.categories.filter(c=>!currentCategory||c.id===currentCategory).map(c=>({category:c,items:c.items.filter(i=>(!q||i.name.toLocaleLowerCase().includes(q)||c.name.toLocaleLowerCase().includes(q))&&(filter==='all'||filter==='priority'&&i.priority||filter==='pending'&&!i.done||filter==='done'&&i.done))})).filter(g=>g.items.length||(!q&&filter==='all'));
  }
  function renderNav() {
    const counts=getCounts();
    $('category-count').textContent=state.categories.length;
    $('category-nav').innerHTML='<button class="nav-item '+(!currentCategory?'active':'')+'" data-category=""><span class="nav-index">◫</span><span class="nav-name">全部分类</span><span class="nav-count">'+counts.total+'</span></button>'+state.categories.map((c,index)=>'<button class="nav-item '+(currentCategory===c.id?'active':'')+'" data-category="'+esc(c.id)+'"><span class="nav-index">'+String(index+1).padStart(2,'0')+'</span><span class="nav-name">'+esc(c.name)+'</span><span class="nav-count">'+c.items.length+'</span></button>').join('');
    $('mobile-category').innerHTML='<option value="">全部分类 · '+counts.total+' 项</option>'+state.categories.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+' · '+c.items.length+' 项</option>').join('');
    $('mobile-category').value=currentCategory;
  }
  function renderStats() {const c=getCounts();$('total-count').textContent=c.total;$('priority-count').textContent=c.priority;$('done-count').textContent=c.done;$('undo').disabled=!history.length;}
  function updateBulk() {
    $('bulk-bar').hidden=!bulk;$('bulk-toggle').classList.toggle('active',bulk);$('bulk-toggle').setAttribute('aria-pressed',String(bulk));$('bulk-toggle').lastChild.textContent=bulk?'退出批量':'批量删减';$('selected-count').textContent=selected.size;$('delete-selected').disabled=!selected.size;
    $('instruction-text').innerHTML=bulk?'勾选想删除的项目，再点「删除所选」 · 可跨分类选择':'直接点名称编辑 · 勾选表示已备齐 · <span class="star">★</span> 表示入住优先';
    const ids=visibleGroups().flatMap(g=>g.items.map(i=>i.id));$('select-visible').textContent=ids.length&&ids.every(id=>selected.has(id))?'取消当前全选':'全选当前结果';
  }
  function resize(textarea) {textarea.style.height='auto';textarea.style.height=textarea.scrollHeight+'px';}
  function render() {
    if(currentCategory&&!findCategory(currentCategory))currentCategory='';
    const existing=new Set(state.categories.flatMap(c=>c.items.map(i=>i.id)));selected=new Set([...selected].filter(id=>existing.has(id)));
    renderStats();renderNav();document.body.classList.toggle('bulk',bulk);updateBulk();
    const groups=visibleGroups();const shown=groups.reduce((n,g)=>n+g.items.length,0);$('view-count').textContent='显示 '+shown+' 项';$('clear-search').hidden=!query;
    $('categories').innerHTML=groups.map(({category:c,items})=>{
      const index=state.categories.findIndex(g=>g.id===c.id)+1;
      return '<section class="category" data-id="'+esc(c.id)+'" aria-label="'+esc(c.name)+'"><div class="category-header"><span class="category-index">'+String(index).padStart(2,'0')+'</span><div class="category-title-wrap"><input class="category-title" data-edit-category="'+esc(c.id)+'" aria-label="分类名称" maxlength="120" value="'+esc(c.name)+'"><div class="category-meta">'+c.items.length+' 项 · '+c.items.filter(i=>i.done).length+' 项已备齐</div></div>'+(bulk?'<button class="category-select" data-select-category="'+esc(c.id)+'">'+(items.length&&items.every(i=>selected.has(i.id))?'取消全选':'选本类')+'</button>':'')+'<button class="icon-btn delete" data-delete-category="'+esc(c.id)+'" aria-label="删除分类：'+esc(c.name)+'" title="删除整个分类（可撤销）">'+icon('trash')+'</button></div><div class="items">'+items.map(i=>'<div class="item '+(i.done&&!bulk?'done ':'')+(bulk&&selected.has(i.id)?'selected':'')+'" data-item="'+esc(i.id)+'"><input type="checkbox" class="item-check" data-check="'+esc(i.id)+'" aria-label="'+(bulk?'选择删除：':'已备齐：')+esc(i.name)+'" '+((bulk?selected.has(i.id):i.done)?'checked':'')+'><textarea class="item-name" rows="1" maxlength="500" data-edit-item="'+esc(i.id)+'" aria-label="项目名称" spellcheck="false">'+esc(i.name)+'</textarea><button class="icon-btn priority '+(i.priority?'on':'')+'" data-priority="'+esc(i.id)+'" aria-label="入住优先：'+esc(i.name)+'" aria-pressed="'+i.priority+'" title="'+(i.priority?'取消入住优先':'标记入住优先')+'">'+icon('star')+'</button><button class="icon-btn delete" data-delete-item="'+esc(i.id)+'" aria-label="删除项目：'+esc(i.name)+'" title="删除此项（可撤销）">'+icon('trash')+'</button></div>').join('')+(!items.length?'<div class="empty-category">这个分类还没有项目，可以从下面添加。</div>':'')+'</div><div class="category-footer"><button class="add-item" data-add-item="'+esc(c.id)+'">'+icon('plus')+'添加一项</button></div></section>';
    }).join('');
    if(!groups.length) {$('categories').innerHTML='<div class="empty-state"><strong>'+(state.categories.length?'没有找到对应项目':'清单已经清空')+'</strong><p>'+(state.categories.length?'换个关键词，或清除筛选看看。':'可以添加分类重新开始，也可以撤销刚才的删除。')+'</p>'+(state.categories.length?'<button class="btn" data-action="clear-filters">清除筛选</button>':'')+(history.length?'<button class="btn" data-action="undo">撤销最近修改</button>':'')+'</div>';}
    $('categories').querySelectorAll('textarea').forEach(resize);
  }
  function undo() {finishEdit();if(!history.length)return;state=history.pop();selected.clear();save();render();notify('已撤销最近一次修改');}
  function focusField(attribute,id) {const field=[...document.querySelectorAll('['+attribute+']')].find(el=>el.getAttribute(attribute)===id);if(field){field.focus();field.select();field.scrollIntoView({block:'nearest'});}}
  function addCategory() {const id=uid();transact(()=>{state.categories.push({id,name:'新分类',items:[]});currentCategory=id;query='';filter='all';$('search').value='';$('filter').value='all';});focusField('data-edit-category',id);}
  function setCategory(id) {finishEdit();currentCategory=id;render();$('main').scrollIntoView({block:'start'});}
  document.addEventListener('focusin',event=>{if(event.target.matches('[data-edit-item],[data-edit-category]'))editStart=clone(state);});
  document.addEventListener('input',event=>{
    const el=event.target;
    if(el.matches('[data-edit-item]')) {const found=findItem(el.dataset.editItem);if(found)found.item.name=el.value.replace(/[\r\n]+/g,' ');resize(el);saveSoon();}
    if(el.matches('[data-edit-category]')) {const c=findCategory(el.dataset.editCategory);if(c)c.name=el.value;saveSoon();}
  });
  document.addEventListener('focusout',event=>{
    const el=event.target;
    if(!el.matches('[data-edit-item],[data-edit-category]'))return;
    const name=el.value.trim().replace(/[\r\n]+/g,' ')||(el.matches('[data-edit-item]')?'未命名项目':'未命名分类');el.value=name;
    if(el.dataset.editItem){const found=findItem(el.dataset.editItem);if(found){found.item.name=name;const row=el.closest('.item');row.querySelector('[data-check]').setAttribute('aria-label',(bulk?'选择删除：':'已备齐：')+name);row.querySelector('[data-delete-item]').setAttribute('aria-label','删除项目：'+name);row.querySelector('[data-priority]').setAttribute('aria-label','入住优先：'+name);}}
    if(el.dataset.editCategory){const c=findCategory(el.dataset.editCategory);if(c)c.name=name;renderNav();el.closest('.category').setAttribute('aria-label',name);el.closest('.category').querySelector('[data-delete-category]').setAttribute('aria-label','删除分类：'+name);}
    finishEdit();save();
  });
  document.addEventListener('keydown',event=>{if(event.target.matches('[data-edit-item],[data-edit-category]')&&event.key==='Enter'&&!event.isComposing){event.preventDefault();event.target.blur();}if(event.key==='Escape'&&bulk){bulk=false;selected.clear();render();}});
  document.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.action==='add-category')return addCategory();
    if(button.dataset.action==='undo')return undo();
    if(button.dataset.action==='clear-filters'){query='';filter='all';currentCategory='';$('search').value='';$('filter').value='all';return render();}
    if(button.hasAttribute('data-category'))return setCategory(button.dataset.category);
    if(button.dataset.deleteItem){const found=findItem(button.dataset.deleteItem);if(!found)return;return transact(()=>{found.category.items=found.category.items.filter(i=>i.id!==found.item.id);},'已删除「'+found.item.name+'」');}
    if(button.dataset.deleteCategory){const c=findCategory(button.dataset.deleteCategory);if(!c)return;return transact(()=>{state.categories=state.categories.filter(g=>g.id!==c.id);},'已删除「'+c.name+'」及其中 '+c.items.length+' 项');}
    if(button.dataset.priority){const found=findItem(button.dataset.priority);if(found)return transact(()=>{found.item.priority=!found.item.priority;});}
    if(button.dataset.addItem){const c=findCategory(button.dataset.addItem),id=uid();if(!c)return;transact(()=>{c.items.push({id,name:'新项目',priority:filter==='priority',done:filter==='done'});query='';$('search').value='';});return focusField('data-edit-item',id);}
    if(button.dataset.selectCategory){const g=visibleGroups().find(g=>g.category.id===button.dataset.selectCategory);if(!g)return;const all=g.items.every(i=>selected.has(i.id));g.items.forEach(i=>all?selected.delete(i.id):selected.add(i.id));return render();}
  });
  document.addEventListener('change',event=>{const el=event.target;if(el.dataset.check){if(bulk){el.checked?selected.add(el.dataset.check):selected.delete(el.dataset.check);el.closest('.item').classList.toggle('selected',el.checked);updateBulk();const section=el.closest('.category'),group=visibleGroups().find(g=>g.category.id===section.dataset.id);if(group)section.querySelector('[data-select-category]').textContent=group.items.length&&group.items.every(i=>selected.has(i.id))?'取消全选':'选本类';}else{const found=findItem(el.dataset.check);if(found)transact(()=>{found.item.done=el.checked;});}}});
  $('search').addEventListener('input',event=>{query=event.target.value;render();});
  $('clear-search').addEventListener('click',()=>{query='';$('search').value='';render();$('search').focus();});
  $('filter').addEventListener('change',event=>{filter=event.target.value;render();});
  $('mobile-category').addEventListener('change',event=>setCategory(event.target.value));
  $('bulk-toggle').addEventListener('click',()=>{finishEdit();bulk=!bulk;selected.clear();render();});
  $('select-visible').addEventListener('click',()=>{const ids=visibleGroups().flatMap(g=>g.items.map(i=>i.id));const all=ids.every(id=>selected.has(id));ids.forEach(id=>all?selected.delete(id):selected.add(id));render();});
  $('delete-selected').addEventListener('click',()=>{const amount=selected.size;if(!amount)return;transact(()=>{state.categories.forEach(c=>{c.items=c.items.filter(i=>!selected.has(i.id));});selected.clear();},'已删除 '+amount+' 个项目');});
  $('undo').addEventListener('click',undo);$('toast-undo').addEventListener('click',undo);
  $('export').addEventListener('click',()=>{
    finishEdit();save();
    const snapshot=clone(state);snapshot.documentId=uid();
    const root=document.documentElement.cloneNode(true);
    root.querySelector('#checklist-data').textContent=JSON.stringify(snapshot).replace(/</g,'\\u003c');
    root.querySelector('#categories').replaceChildren();root.querySelector('#category-nav').replaceChildren();root.querySelector('#mobile-category').replaceChildren();root.querySelector('#toast').hidden=true;root.querySelector('#bulk-bar').hidden=true;root.querySelector('#search').value='';
    const blob=new Blob(['<!DOCTYPE html>\n'+root.outerHTML],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;
    const date=new Date(),stamp=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
    link.download='新家采购清单-'+stamp+'.html';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notify('已下载当前版本，打开下载的 HTML 即可继续编辑');
  });
  let printView=null;
  window.addEventListener('beforeprint',()=>{printView={currentCategory,query,filter,bulk};currentCategory='';query='';filter='all';bulk=false;render();});
  window.addEventListener('afterprint',()=>{if(printView){({currentCategory,query,filter,bulk}=printView);printView=null;render();}});
  window.addEventListener('beforeunload',save);
  render();save();
})();
</script>
</body>
</html>
