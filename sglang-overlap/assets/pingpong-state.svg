<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="474" viewBox="0 0 1040 474" role="img" aria-label="图 6 · Ping / pong 到底保存了什么"><title>图 6 · Ping / pong 到底保存了什么</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1040" height="474" fill="#fff"/><g font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, sans-serif"><text x="28" y="36" font-size="21" fill="#0f172a" text-anchor="start" font-weight="750">图 6 · Ping / pong 到底保存了什么</text><text x="28" y="78" font-size="16" fill="#0f172a" text-anchor="start" font-weight="650">同一组 GPU / 同一套模型权重</text><rect x="30" y="105" width="260" height="160" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/><text x="160" y="182" font-size="15" fill="#475569" text-anchor="middle" font-weight="650">Parent ForwardBatch</text><text x="160" y="203" font-size="12" fill="#475569" text-anchor="middle" font-weight="400">token 范围、positions、residual</text><path d="M290,156 L365,156" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M290,230 L365,292" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="370" y="106" width="300" height="108" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="520" y="157" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="650">Child A · state A</text><text x="520" y="178" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="400">token slice A / attention metadata A</text><rect x="370" y="250" width="300" height="108" rx="7" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="520" y="301" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="650">Child B · state B</text><text x="520" y="322" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="400">token slice B / attention metadata B</text><path d="M670,160 L715,160" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M670,305 L715,305" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="720" y="106" width="290" height="108" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="865" y="157" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="650">Dispatcher 0</text><text x="865" y="178" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="400">A 的 handle / event / 中间结果</text><rect x="720" y="250" width="290" height="108" rx="7" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="865" y="301" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="650">Dispatcher 1</text><text x="865" y="322" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="400">B 的 handle / event / 中间结果</text><text x="28" y="412" font-size="16" fill="#334155" text-anchor="start" font-weight="400">交替推进执行状态；完成后按 parent token range 放回输出。</text><text x="28" y="444" font-size="15" fill="#334155" text-anchor="start" font-weight="400">两份 dispatcher 状态 ≠ 两份模型，也不等于“复制两份完整 KV cache”。</text></g></svg>