<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img" aria-label="图 2 · SBO 的两个 shared-expert 窗口"><title>图 2 · SBO 的两个 shared-expert 窗口</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1040" height="460" fill="#fff"/><g font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, sans-serif"><text x="28" y="36" font-size="21" fill="#0f172a" text-anchor="start" font-weight="750">图 2 · SBO 的两个 shared-expert 窗口</text><text x="28" y="78" font-size="17" fill="#0f172a" text-anchor="start" font-weight="650">① Dispatch × shared：发送发起以后，接收等待以前</text><text x="28" y="125" font-size="14" fill="#334155" text-anchor="start" font-weight="400">主 stream</text><rect x="160" y="98" width="112" height="48" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="216" y="127" font-size="15" fill="#b45309" text-anchor="middle" font-weight="650">send</text><rect x="285" y="98" width="235" height="48" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="402.5" y="127" font-size="15" fill="#15803d" text-anchor="middle" font-weight="650">Shared expert</text><rect x="534" y="98" width="132" height="48" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="600" y="127" font-size="15" fill="#b45309" text-anchor="middle" font-weight="650">recv / wait</text><rect x="680" y="98" width="210" height="48" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="785" y="127" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="650">Routed experts</text><text x="28" y="188" font-size="14" fill="#334155" text-anchor="start" font-weight="400">网络进展</text><rect x="273" y="162" width="337" height="42" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="441.5" y="188" font-size="15" fill="#b45309" text-anchor="middle" font-weight="650">Dispatch 数据在传输</text><text x="686" y="189" font-size="13" fill="#334155" text-anchor="start" font-weight="400">同一 stream 也可留下网络重叠窗口</text><text x="28" y="255" font-size="17" fill="#0f172a" text-anchor="start" font-weight="650">② Combine × shared：两个 stream 分别推进，输出前汇合</text><text x="28" y="302" font-size="14" fill="#334155" text-anchor="start" font-weight="400">主 stream</text><rect x="160" y="275" width="245" height="48" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="282.5" y="304" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="650">Routed experts 完成</text><rect x="425" y="275" width="280" height="48" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="565" y="304" font-size="15" fill="#15803d" text-anchor="middle" font-weight="650">Shared expert</text><rect x="790" y="275" width="215" height="48" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/><text x="897.5" y="304" font-size="15" fill="#475569" text-anchor="middle" font-weight="650">join → 相加</text><text x="28" y="365" font-size="14" fill="#334155" text-anchor="start" font-weight="400">alt stream</text><rect x="425" y="338" width="335" height="48" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="592.5" y="367" font-size="15" fill="#b45309" text-anchor="middle" font-weight="650">Combine</text><path d="M405,299 L425,360" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M760,359 L790,306" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="28" y="435" font-size="14" fill="#334155" text-anchor="start" font-weight="400">两行是两种策略，不是同一个 shared expert 重算两遍。块宽仅为示意，不代表实测耗时。</text></g></svg>