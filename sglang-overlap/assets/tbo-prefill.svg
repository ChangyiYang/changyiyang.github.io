<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="683" viewBox="0 0 1040 683" role="img" aria-label="图 4 · Prefill TBO：A / B 轮流提交，通信留在后台推进"><title>图 4 · Prefill TBO：A / B 轮流提交，通信留在后台推进</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1040" height="683" fill="#fff"/><g font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, sans-serif"><text x="28" y="36" font-size="21" fill="#0f172a" text-anchor="start" font-weight="750">图 4 · Prefill TBO：A / B 轮流提交，通信留在后台推进</text><text x="28" y="78" font-size="15" fill="#334155" text-anchor="start" font-weight="400">横轴 = 主机提交的 stage 顺序（不是 GPU 等长时间格）</text><rect x="30" y="102" width="305" height="82" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="182.5" y="140" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="650">A0</text><text x="182.5" y="161" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="400">Attn → dispatch_a</text><path d="M335,143 L361,143" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="367" y="102" width="305" height="82" rx="7" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="519.5" y="140" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="650">B0</text><text x="519.5" y="161" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="400">Attn → dispatch_a</text><path d="M672,143 L698,143" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="704" y="102" width="305" height="82" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="856.5" y="140" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="650">A1</text><text x="856.5" y="161" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="400">dispatch_b → E → combine_a</text><rect x="30" y="232" width="305" height="82" rx="7" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="182.5" y="270" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="650">B1</text><text x="182.5" y="291" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="400">dispatch_b → E → combine_a</text><path d="M335,273 L361,273" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="367" y="232" width="305" height="82" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="519.5" y="270" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="650">A2</text><text x="519.5" y="291" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="400">Shared → combine_b → out</text><path d="M672,273 L698,273" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="704" y="232" width="305" height="82" rx="7" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="856.5" y="270" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="650">B2</text><text x="856.5" y="291" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="400">Shared → combine_b → out</text><path d="M1009 185 V205 H15 V273 H28" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/><text x="28" y="358" font-size="16" fill="#334155" text-anchor="start" font-weight="400">A0 发起 dispatch → B0 做 attention 时，A 的通信可以推进。</text><text x="28" y="388" font-size="16" fill="#334155" text-anchor="start" font-weight="400">A1 发起 combine → B1 做 expert 时，A 的结果可以回传。</text><text x="28" y="418" font-size="15" fill="#334155" text-anchor="start" font-weight="400">每次切换保留各自状态；dispatch_b / combine_b 到真正消费数据时才收口。</text><text x="28" y="452" font-size="13" fill="#334155" text-anchor="start" font-weight="400">E = routed experts；A2 后可进入下一层 A0。图中 0→1→2 是同一层的三个 stage。</text><text x="30" y="499" font-size="16" fill="#0f172a" text-anchor="start" font-weight="650">窗口 1 · A 的 dispatch × B 的 attention</text><text x="554" y="499" font-size="16" fill="#0f172a" text-anchor="start" font-weight="650">窗口 2 · A 的 combine × B 的 experts</text><text x="30" y="542" font-size="14" fill="#334155" text-anchor="start" font-weight="400">A 通信</text><rect x="115" y="514" width="365" height="43" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="297.5" y="540.5" font-size="15" fill="#b45309" text-anchor="middle" font-weight="650">Dispatch 在途</text><text x="30" y="600" font-size="14" fill="#334155" text-anchor="start" font-weight="400">B 计算</text><rect x="115" y="572" width="282" height="43" rx="7" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="256" y="598.5" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="650">Attention</text><text x="554" y="542" font-size="14" fill="#334155" text-anchor="start" font-weight="400">A 通信</text><rect x="639" y="514" width="365" height="43" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="821.5" y="540.5" font-size="15" fill="#b45309" text-anchor="middle" font-weight="650">Combine 在途</text><text x="554" y="600" font-size="14" fill="#334155" text-anchor="start" font-weight="400">B 计算</text><rect x="639" y="572" width="282" height="43" rx="7" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="780" y="598.5" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="650">Routed experts</text><text x="30" y="655" font-size="14" fill="#334155" text-anchor="start" font-weight="400">下方横轴为局部时间示意；两行横向交叠表示潜在 overlap，不代表实测时长或完全隐藏。</text></g></svg>