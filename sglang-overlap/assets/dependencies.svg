<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-label="图 1 · 同一个 batch：先看谁依赖谁"><title>图 1 · 同一个 batch：先看谁依赖谁</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1040" height="330" fill="#fff"/><g font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, sans-serif"><text x="28" y="36" font-size="21" fill="#0f172a" text-anchor="start" font-weight="750">图 1 · 同一个 batch：先看谁依赖谁</text><rect x="30" y="110" width="135" height="66" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/><text x="97.5" y="148" font-size="15" fill="#475569" text-anchor="middle" font-weight="650">MoE 输入 x</text><path d="M165,143 L206,143" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="210" y="110" width="130" height="66" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="275" y="148" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="650">Router / Top-k</text><path d="M340,143 L376,143" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="380" y="110" width="125" height="66" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="442.5" y="148" font-size="15" fill="#b45309" text-anchor="middle" font-weight="650">Dispatch</text><path d="M505,143 L541,143" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="545" y="110" width="130" height="66" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="610" y="148" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="650">Routed experts</text><path d="M675,143 L711,143" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="715" y="110" width="125" height="66" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="777.5" y="148" font-size="15" fill="#b45309" text-anchor="middle" font-weight="650">Combine</text><path d="M840,143 L880,143" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="885" y="110" width="120" height="66" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/><text x="945" y="148" font-size="15" fill="#475569" text-anchor="middle" font-weight="650">相加 → 输出</text><path d="M98 176 V239 H378" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="380" y="210" width="295" height="58" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/><text x="527.5" y="236" font-size="15" fill="#15803d" text-anchor="middle" font-weight="650">Shared expert S(x)</text><text x="527.5" y="257" font-size="12" fill="#15803d" text-anchor="middle" font-weight="400">只读原始 x，不等远端 token</text><path d="M675 239 H945 V178" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="30" y="79" font-size="14" fill="#334155" text-anchor="start" font-weight="400">蓝色 = routed / attention 计算    黄色 = EP 通信    绿色 = shared expert    箭头 = 数据依赖</text><text x="30" y="307" font-size="15" fill="#334155" text-anchor="start" font-weight="400">可挪动的是 shared 分支；同一份 routed 数据仍必须先 dispatch，再计算，再 combine。</text></g></svg>