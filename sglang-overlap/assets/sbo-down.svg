<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="375" viewBox="0 0 1040 375" role="img" aria-label="图 3 · Down GEMM × combine：依赖被细化，没有消失"><title>图 3 · Down GEMM × combine：依赖被细化，没有消失</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1040" height="375" fill="#fff"/><g font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, sans-serif"><text x="28" y="36" font-size="21" fill="#0f172a" text-anchor="start" font-weight="750">图 3 · Down GEMM × combine：依赖被细化，没有消失</text><text x="28" y="77" font-size="15" fill="#334155" text-anchor="start" font-weight="400">先完成的结果块可以先发送；尚未完成的结果块仍然必须等待 readiness signal。</text><text x="28" y="133" font-size="14" fill="#334155" text-anchor="start" font-weight="400">计算 stream</text><rect x="170" y="108" width="205" height="50" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="272.5" y="138" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="650">down：块 0</text><rect x="390" y="108" width="205" height="50" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="492.5" y="138" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="650">down：块 1</text><rect x="610" y="108" width="205" height="50" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/><text x="712.5" y="138" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="650">down：块 2</text><text x="28" y="244" font-size="14" fill="#334155" text-anchor="start" font-weight="400">通信 stream</text><rect x="390" y="218" width="205" height="50" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="492.5" y="248" font-size="15" fill="#b45309" text-anchor="middle" font-weight="650">combine：块 0</text><rect x="610" y="218" width="205" height="50" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="712.5" y="248" font-size="15" fill="#b45309" text-anchor="middle" font-weight="650">combine：块 1</text><rect x="830" y="218" width="180" height="50" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/><text x="920" y="248" font-size="15" fill="#b45309" text-anchor="middle" font-weight="650">combine：块 2</text><path d="M373,158 L390,215" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M593,158 L610,215" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M813,158 L830,215" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="390" y="188" font-size="12" fill="#334155" text-anchor="start" font-weight="400">ready 0</text><text x="610" y="188" font-size="12" fill="#334155" text-anchor="start" font-weight="400">ready 1</text><text x="830" y="188" font-size="12" fill="#334155" text-anchor="start" font-weight="400">ready 2</text><text x="28" y="316" font-size="15" fill="#334155" text-anchor="start" font-weight="400">start event：允许通信 kernel 开始运行     ·     readiness signal：允许读取对应结果</text><text x="28" y="345" font-size="14" fill="#334155" text-anchor="start" font-weight="400">这是 producer–consumer 流水示意；实际通知粒度由后端决定，不保证逐 token / 逐 tile。</text></g></svg>